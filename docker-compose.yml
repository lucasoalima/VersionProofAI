services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: versionproof
    ports: ["5433:5432"]  # host port 5433 avoids clashing with a local PostgreSQL
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/versionproof
      INGESTION_ROOT: /data
      # 'hashed' is a dependency-free bag-of-words embedding so semantic/hybrid work out of the box.
      # Use sentence_transformers for a real model (see README).
      EMBEDDING_PROVIDER: hashed
      LLM_PROVIDER: none
    volumes: ["./data:/data:ro"]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://backend:8000
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  pgdata:
