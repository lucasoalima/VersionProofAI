[project]
name = "versionproof-backend"
version = "0.1.0"
description = "VersionProof AI — version-aware documentation retrieval backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pgvector>=0.3",
  "structlog>=24.1",
  "pyyaml>=6.0",
]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]
embeddings = ["sentence-transformers>=3.0"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires TEST_DATABASE_URL pointing at PostgreSQL+pgvector"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["B008", "E501"]  # B008: FastAPI Depends() idiom; E501: line-length handled by formatter
